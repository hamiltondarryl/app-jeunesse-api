# PAMJ / jeunesse — VPS NDAMBO (72.62.60.10)
# Domaine (serveur Hostinger) : pamj-dgjase.com
# DNS A/CNAME doivent pointer vers 72.62.60.10 pour que le HTTPS fonctionne.
#
#   certbot --nginx -d pamj-dgjase.com -d www.pamj-dgjase.com

upstream jeunesse_web {
    server 127.0.0.1:8180;
    keepalive 16;
}

upstream jeunesse_api {
    server 127.0.0.1:4100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pamj-dgjase.com www.pamj-dgjase.com;

    client_max_body_size 12m;
    server_tokens off;

    location /api/ {
        proxy_pass http://jeunesse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://jeunesse_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
